services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build: .
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=shared-secret-for-all-instances
      - JWT_EXPIRATION=24h
      - RATE_LIMIT_TTL=60
      - RATE_LIMIT_MAX=30
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app2:
    build: .
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=shared-secret-for-all-instances
      - JWT_EXPIRATION=24h
      - RATE_LIMIT_TTL=60
      - RATE_LIMIT_MAX=30
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
